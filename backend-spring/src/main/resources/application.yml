server:
  port: 8080

spring:
  application:
    name: backend-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:21432/moveai}
    username: ${SPRING_DATASOURCE_USERNAME:moveai}
    password: ${SPRING_DATASOURCE_PASSWORD:moveai}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

moveai:
  ai-base-url: ${AI_BASE_URL:http://backend-ai:8000}
  kakao-rest-key: ${KAKAO_REST_KEY:}
  cargo-photo-dir: ${CARGO_PHOTO_DIR:/data/cargo-photos}

admin:
  matching:
    base-url: ${ADMIN_MATCHING_BASE_URL:https://matching-processor-xi6ooeq3ta-du.a.run.app}
  vision:
    base-url: ${ADMIN_VISION_BASE_URL:https://vision-processor-xi6ooeq3ta-du.a.run.app}
