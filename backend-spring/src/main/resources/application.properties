kakao.rest.key=${KAKAO_REST_KEY:}
spring.application.name=backend-spring
spring.datasource.url=jdbc:postgresql://db:5432/moveaidb
spring.datasource.username=moveaiuser
spring.datasource.password=moveaipass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 관리자 BFF → Cloud Run (브라우저는 /api/admin/* 만 호출)
admin.matching.base-url=${ADMIN_MATCHING_BASE_URL:https://matching-processor-xi6ooeq3ta-du.a.run.app}
admin.vision.base-url=${ADMIN_VISION_BASE_URL:https://vision-processor-xi6ooeq3ta-du.a.run.app}
ai.base-url=${AI_BASE_URL:http://backend-ai:8000}
