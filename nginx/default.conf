# Reverse proxy — HTTP only (port 30100 → container :80)
# 서비스명(frontend) 대신 컨테이너명 고정 — HIST 등 다른 스택과 DNS 충돌 방지
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://mvp-moveai-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://mvp-moveai-frontend-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }

    location /api {
        proxy_pass http://mvp-moveai-backend-spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://mvp-moveai-backend-spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location /ai {
        proxy_pass http://mvp-moveai-backend-ai:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;
        proxy_read_timeout 300s;
    }
}
