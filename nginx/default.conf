server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # 컨테이너명으로 고정 — 공유 네트워크에 다른 frontend가 있어도 오탐 방지
    location /api/ {
        proxy_pass http://hist-moveai-backend-spring:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ai/ {
        proxy_pass http://hist-moveai-backend-ai:8000/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://hist-moveai-frontend-admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://hist-moveai-frontend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
