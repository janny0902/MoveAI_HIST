# HIST 게이트웨이 겸용 (별도 hist-moveai-nginx 제거)
# 호스트 :20100 → 이 컨테이너 :80
server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://hist-moveai-backend-spring:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ai/ {
        proxy_pass http://hist-moveai-backend-ai:8000/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /uploads/ {
        proxy_pass http://hist-moveai-backend-spring:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://hist-moveai-frontend-admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
