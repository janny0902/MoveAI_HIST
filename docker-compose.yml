# HIST 전용 스택 (기존 30100 moveai-mvp 와 병행)
# 기동: docker compose up -d --build
# 접속: http://HOST:20100
name: moveai-hist

networks:
  moveainetwork:
    name: moveainetwork-hist

services:
  db:
    image: postgres:15-alpine
    container_name: hist-moveai-db
    environment:
      POSTGRES_DB: moveai
      POSTGRES_USER: moveai
      POSTGRES_PASSWORD: moveai
    volumes:
      - hist_pgdata:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # 25432 등은 타 스택이 쓸 수 있어 HIST 전용 포트 사용
      - "21432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveai -d moveai"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - moveainetwork
    restart: unless-stopped

  # CSV 없어도 항상 exit 0. 실패해도 spring/ai 기동을 막지 않음
  db-import:
    image: postgres:15-alpine
    container_name: hist-moveai-db-import
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: moveai
      PGPASSWORD: moveai
      PGDATABASE: moveai
    volumes:
      - ./db-init:/scripts:ro
      - ./Volumetric data:/data/volumetric:ro
    entrypoint: ["/bin/sh", "/scripts/import_volumetric.sh"]
    networks:
      - moveainetwork
    restart: "no"

  backend-spring:
    build:
      context: ./backend-spring
    container_name: hist-moveai-backend-spring
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/moveai
      SPRING_DATASOURCE_USERNAME: moveai
      SPRING_DATASOURCE_PASSWORD: moveai
      AI_BASE_URL: http://backend-ai:8000
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
    ports:
      - "21808:8080"
    networks:
      - moveainetwork
    restart: unless-stopped

  backend-ai:
    build:
      context: ./backend-ai
    container_name: hist-moveai-backend-ai
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-moveai-504907}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      VERTEX_ENDPOINT_ID: ${VERTEX_ENDPOINT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      TORCH_HUB_DIR: /tmp/torch
      HF_HOME: /tmp/huggingface
      TRUCK_CAPACITY_M3: "50"
    volumes:
      # .env 에 GOOGLE_ADC_PATH= 빈값 넣지 말 것 (기본 placeholder 사용)
      - ${GOOGLE_ADC_PATH:-./backend-ai/.adc-placeholder.json}:/gcp/adc.json:ro
      - ./Volumetric data:/data/volumetric:ro
    ports:
      - "21800:8000"
    networks:
      - moveainetwork
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY:-}
    container_name: hist-moveai-frontend
    networks:
      - moveainetwork
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
    container_name: hist-moveai-frontend-admin
    environment:
      VISION_BASE_URL: ${ADMIN_VISION_BASE_URL:-https://vision-processor-xi6ooeq3ta-du.a.run.app}
      MATCHING_BASE_URL: ${ADMIN_MATCHING_BASE_URL:-https://matching-processor-xi6ooeq3ta-du.a.run.app}
      KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY:-}
    networks:
      - moveainetwork
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hist-moveai-nginx
    depends_on:
      - frontend
      - frontend-admin
      - backend-spring
      - backend-ai
    ports:
      - "20100:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - moveainetwork
    restart: unless-stopped

volumes:
  hist_pgdata:
    name: moveai-hist-pgdata
